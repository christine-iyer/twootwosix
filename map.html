    <script>
        // Load and display congressional district results
        document.getElementById('loading').style.display = 'block';
        
        // Try to load from data folder, handle both local and GitHub Pages
        // Add timestamp to prevent caching
        const timestamp = new Date().getTime();
        const csvPath = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? `data/congressional_district_results.csv?v=${timestamp}`
            : `./data/congressional_district_results.csv?v=${timestamp}`;
        
        Papa.parse(csvPath, {
            download: true,
            header: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                
                const data = results.data
                    .filter(row => row.district_geoid && row.votes_total) // Filter out empty rows
                    .map(row => {
                        const total = parseFloat(row.votes_total) || 0;
                        const dem = parseFloat(row.votes_dem) || 0;
                        const rep = parseFloat(row.votes_rep) || 0;
                        const demPct = parseFloat(row.dem_pct) || 0;
                        const repPct = parseFloat(row.rep_pct) || 0;
                        const margin = parseFloat(row.dem_lead_pct) || 0;
                        
                        // Extract state from district GEOID (first 2 digits)
                        const stateCode = row.district_geoid.substring(0, 2);
                        
                        return [
                            row.district_geoid,
                            row.state || stateCode,
                            row.district_name,
                            row.representative || '',
                            row.reelection_year || '',
                            dem.toLocaleString(),
                            rep.toLocaleString(),
                            total.toLocaleString(),
                            demPct.toFixed(1) + '%',
                            repPct.toFixed(1) + '%',
                            (margin >= 0 ? '+' : '') + margin.toFixed(1) + '%',
                            row.winner
                        ];
                    });
                
                $('#precinctTable').DataTable({
                    data: data,
                    pageLength: 25,
                    order: [[7, 'desc']], // Sort by total votes (column index changed)
                    dom: 'Bfrtip',
                    buttons: [
                        'copy', 'csv', 'excel', 'print'
                    ],
                    language: {
                        info: 'Showing _START_ to _END_ of _TOTAL_ districts',
                        infoFiltered: '(filtered from _MAX_ total districts)'
                    },
                    columnDefs: [
                        {
                            targets: 11, // Winner column (now index 11)
                            createdCell: function (td, cellData, rowData, row, col) {
                                if (cellData === 'DEM') {
                                    $(td).css('background-color', '#e3f2fd');
                                    $(td).css('color', '#1976d2');
                                    $(td).css('font-weight', 'bold');
                                } else if (cellData === 'REP') {
                                    $(td).css('background-color', '#ffebee');
                                    $(td).css('color', '#c62828');
                                    $(td).css('font-weight', 'bold');
                                }
                            }
                        },
                        {
                            targets: 10, // Margin column (now index 10)
                            createdCell: function (td, cellData, rowData, row, col) {
                                const margin = parseFloat(cellData);
                                if (margin > 0) {
                                    $(td).css('color', '#1976d2');
                                } else if (margin < 0) {
                                    $(td).css('color', '#c62828');
                                }
                            }
                        }
                    ]
                });
                
                console.log('Loaded', data.length, 'congressional districts');
            },
            error: function(error) {
                document.getElementById('loading').innerHTML = 
                    '<p style="color: red;">Error loading data: ' + error.message + '</p>' +
                    '<p>Make sure congressional_district_results.csv exists in the data/ folder.</p>';
            }
        });
